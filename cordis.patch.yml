# dsh-mobile-ui bundle layer.
#
# One install = mobile access to a DeepSeek Harness web profile. Both helpers are
# VENDORED inside this package (`vendor/`), so nothing else has to be installed
# and no other plugin is required:
#   * `dsh-mobile-ui/relay`  — password sign-in + TLS in front of the loopback
#     webserver (vendored dsh-relay host half);
#   * `dsh-mobile-ui/tunnel` — ngrok (cloudflared as fallback) exposes the relay
#     publicly (vendored dsh-tunnel);
#   * `dsh-mobile-ui`        — the mobile layer over the official web UI.
#
# The official web app is served by the base bundle (`@deepseek-ai/dsh-web-app`);
# nothing else in the harness is touched. Removing this bundle removes all three.
#
# ngrok vs cloudflared: the tunnel reads `provider` below. ngrok needs an account
# and authtoken (run `ngrok config add-authtoken <token>` once) and blocks Russian
# addresses with ERR_NGROK_9040; cloudflared works without an account. Flip
# `provider` (or set `DSH_TUNNEL_PROVIDER=cloudflared`) when ngrok is unavailable.
#
# `publicHostnames` stays empty on purpose. The relay answers only the authorities
# it knows about, and the tunnel name is not one of them; the vendored tunnel
# therefore rewrites the origin Host to the loopback name of `target`, which the
# relay always trusts. That is why `updateRelayHostnames` is off: there is no relay
# row in the profile patch for the tunnel to rewrite, and it is not needed.

- insert:
    - id: relay
      name: 'dsh-mobile-ui/relay'
      disabled: !!js process.env.DSH_RELAY_DISABLE === '1'
      config:
        bind: !!js process.env.DSH_RELAY_BIND ?? '0.0.0.0'
        port: !!js Number(process.env.DSH_RELAY_PORT ?? 3443)
        stateDir: !!js dshHomePath('relay')
        tls: !!js process.env.DSH_RELAY_TLS ?? 'self-signed'
        publicHostnames: []
        # 30 days: sign in on a phone rarely. Tunnel clients all arrive from
        # 127.0.0.1 behind the proxy, so address grants are off.
        sessionTtlMs: 2592000000
        rateLimitPerMinute: 6000
        maxFailedAttempts: 20
        lockoutMs: 300000
        # Код подключения телефона живёт 10 секунд и срабатывает один раз: он
        # показан рядом с QR в настройках, а QR несёт тот же код внутри себя.
        pairingWindowMs: 10000
        pairingCodeLength: 8
        compat:
          addressGrants: false
          addressGrantTtlMs: 86400000
          plainPort: 0
    - id: tunnel
      name: 'dsh-mobile-ui/tunnel'
      config:
        provider: !!js process.env.DSH_TUNNEL_PROVIDER ?? 'ngrok'
        target: 'https://127.0.0.1:3443'
        updateRelayHostnames: false
    - id: mobile-ui
      name: 'dsh-mobile-ui'
      config:
        # Откуда host-половина берёт то, что показывает в настройках: ссылку
        # пишет вшитый туннель, признак пароля хранит вшитый relay.
        tunnelUrlFile: !!js dshHomePath('tunnel-url.txt')
        relayStateFile: !!js dshHomePath('relay/state.json')
        relayPort: !!js Number(process.env.DSH_RELAY_PORT ?? 3443)
        tunnelProvider: !!js process.env.DSH_TUNNEL_PROVIDER ?? 'ngrok'
